packages:
  - 'apps/*'
  - 'packages/*'

# Build-script allow-list. `allowBuilds` is the ONLY key pnpm 11 honours
# here; it is the object form, `true` = run the postinstall.
#
#   esbuild            - vitest's transform pipeline
#   @prisma/*, prisma  - query engine binary (from P4)
#   unrs-resolver      - eslint-plugin-import-x resolver
#   argon2             - password hashing (ADR-007). Same class as the Prisma
#                        query engine: a native binding whose postinstall
#                        resolves the platform `.node` binary. Allowed on the
#                        owner's explicit approval of the dependency
#                        (`AGENTS.md` §8), not as a blanket native-module
#                        exemption.
#
# Everything not listed stays blocked, so a supply-chain postinstall
# cannot run unapproved. That blocking is deliberate and is the point of
# this file; it is not a defect to be worked around with
# `pnpm approve-builds`.
#
# DO NOT reintroduce `onlyBuiltDependencies` as an alternative. It is
# INERT in pnpm 11.22.0: `pnpm config get onlyBuiltDependencies` reads the
# array back correctly, so it looks configured, but pnpm never acts on it.
# Verified 2026-09-29 - with that key alone, pnpm reported
# ERR_PNPM_IGNORED_BUILDS for four packages (esbuild, @prisma/client,
# @prisma/engines, prisma) and exited 1; with the equivalent allowBuilds
# block it exits 0 and the postinstalls run. A key that reads back
# correctly and does nothing is worse than a key that is absent, because
# it is indistinguishable from a working one.
#
# This file previously carried an `allowBuilds` block whose values were
# the literal string "set this to true or false" - never filled in. pnpm
# could not interpret it, so `pnpm add` exited 1 while `pnpm install` on
# an already-satisfied tree exited 0 and hid the breakage.
#
# Regression test: apps/api/src/config/workspace-config.spec.ts
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: true
